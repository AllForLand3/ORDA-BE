name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgis:
        image: pgrouting/pgrouting:14-3.5-3.8.0
        env:
          POSTGRES_DB: orda_ci
          POSTGRES_USER: orda_ci
          POSTGRES_PASSWORD: orda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orda_ci -d orda_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orda_ci
      SPRING_DATASOURCE_USERNAME: orda_ci
      SPRING_DATASOURCE_PASSWORD: orda_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Validate Flyway migration names and versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          migration_files=(src/main/resources/db/migration/V*.sql)
          if (( ${#migration_files[@]} == 0 )); then
            echo "::error::No Flyway migration files were found."
            exit 1
          fi

          declare -A seen_versions=()
          for migration in "${migration_files[@]}"; do
            filename="$(basename "$migration")"
            if [[ ! "$filename" =~ ^V([0-9]{14})__([a-z0-9]+(_[a-z0-9]+)*)\.sql$ ]]; then
              echo "::error file=$migration::Flyway migration name must match VyyyyMMddHHmmss__lowercase_snake_case.sql"
              exit 1
            fi

            version="${BASH_REMATCH[1]}"
            if [[ -n "${seen_versions[$version]:-}" ]]; then
              echo "::error file=$migration::Duplicate Flyway version $version: ${seen_versions[$version]} and $migration"
              exit 1
            fi
            seen_versions[$version]="$migration"
          done

      - name: Check Spotless
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: Check Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check

      - name: Apply Flyway migrations to temporary PostGIS
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.flywaydb:flyway-maven-plugin:8.5.13:migrate
          -Dflyway.url="$SPRING_DATASOURCE_URL"
          -Dflyway.user="$SPRING_DATASOURCE_USERNAME"
          -Dflyway.password="$SPRING_DATASOURCE_PASSWORD"
          -Dflyway.locations=filesystem:src/main/resources/db/migration

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Build WAR
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build Docker image
        run: docker build --tag orda-api:ci .
