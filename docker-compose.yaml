services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: orda-api:local
    container_name: orda-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      ORDA_AUTH_JWT_SECRET_BASE64: ${ORDA_AUTH_JWT_SECRET_BASE64:-}
      ORDA_AUTH_JWT_ACCESS_TOKEN_SECONDS: ${ORDA_AUTH_JWT_ACCESS_TOKEN_SECONDS:-3600}
      ORDA_AUTH_CORS_ALLOWED_ORIGINS: ${ORDA_AUTH_CORS_ALLOWED_ORIGINS:-}
    networks:
      - orda-network

networks:
  orda-network:
    external: true
    name: orda-db_default
