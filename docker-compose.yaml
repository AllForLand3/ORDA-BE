services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: orda-api:local
    container_name: orda-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      # 로그인 기능 개발 전 임시 코드
      ORDA_COURSE_WORKSPACE_OWNER_USER_ID: ${ORDA_COURSE_WORKSPACE_OWNER_USER_ID}
      ORDA_COURSE_MAX_COORDINATES: ${ORDA_COURSE_MAX_COORDINATES:-10000}
      ORDA_COURSE_MAX_BODY_BYTES: ${ORDA_COURSE_MAX_BODY_BYTES:-2097152}
    networks:
      - orda-network

networks:
  orda-network:
    external: true
    name: orda-db_default
