spring:
  application:
    name: orda-api
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
mybatis:
  mapper-locations: classpath*:sqlmap/**/*.xml
  configuration:
    arg-name-based-constructor-auto-mapping: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
orda:
  dem:
    base-directory: ${ORDA_DEM_BASE_DIRECTORY:}
  course:
    # 로그인 기능 개발 전 임시 코드
    workspace-owner-user-id: ${ORDA_COURSE_WORKSPACE_OWNER_USER_ID:}
    max-coordinates: ${ORDA_COURSE_MAX_COORDINATES:10000}
    max-body-bytes: ${ORDA_COURSE_MAX_BODY_BYTES:2097152}
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
