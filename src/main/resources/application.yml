spring:
  application:
    name: orda-api
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
mybatis:
  mapper-locations: classpath*:sqlmap/**/*.xml
  configuration:
    arg-name-based-constructor-auto-mapping: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
orda:
  auth:
    cors:
      allowed-origins: ${ORDA_AUTH_CORS_ALLOWED_ORIGINS:}
    jwt:
      secret-base64: ${ORDA_AUTH_JWT_SECRET_BASE64:}
      access-token-seconds: ${ORDA_AUTH_JWT_ACCESS_TOKEN_SECONDS:3600}
  route:
    # 스냅 허용 거리 기준 확정 전 임시 값
    snap-max-distance-m: ${ORDA_ROUTE_SNAP_MAX_DISTANCE_M:300}
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
